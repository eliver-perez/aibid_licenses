<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 210" width="100%" height="100%">
  <style>
    .brand-title-vert-dark {
      font-family: 'Plus Jakarta Sans', 'Inter', 'Montserrat', sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: #FFFFFF;
      letter-spacing: 3px;
      dominant-baseline: central;
    }
    .brand-sub-vert-dark {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      font-weight: 700;
      font-size: 11.5px;
      fill: #E2E8F0;
      letter-spacing: 1.5px;
    }
    .brand-tagline-vert-dark {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      font-weight: 500;
      font-size: 13.5px;
      fill: #94A3B8;
    }
  </style>

  <defs>
    <!-- Silueta base para ambas carpetas -->
    <path id="folder-shape-vert-light" d="M 3 0 H 28 L 36 6 H 44 A 4 4 0 0 1 48 10 V 60 A 3 3 0 0 1 45 63 H 3 A 3 3 0 0 1 0 60 V 3 A 3 3 0 0 1 3 0 Z" />
  </defs>

  <!-- BLOQUE SUPERIOR: ÍCONO + AIBID -->
  <g transform="translate(137, 15)">
    <!-- Carpeta Trasera (Gris Slate Medio) -->
    <use href="#folder-shape-vert-light" x="15" y="8" fill="#64748B" />
    
    <!-- Carpeta Frontal (Blanco Neutro / Casi Blanco) -->
    <use href="#folder-shape-vert-light" x="10" y="13" fill="#F8FAFC" />
    
    <!-- Lupa (Interior Blanco / Contorno y Mango Oscuro) -->
    <circle cx="28" cy="43" r="14" fill="#FFFFFF" stroke="#0F172A" stroke-width="4" />
    <line x1="18" y1="53" x2="8" y2="63" stroke="#0F172A" stroke-width="4.5" stroke-linecap="round" />
    
    <!-- Texto AIBID -->
    <text x="78" y="45" class="brand-title-vert-dark">AIBID</text>
  </g>

  <!-- LÍNEA SEPARADORA HORIZONTAL -->
  <line x1="110" y1="108" x2="410" y2="108" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />

  <!-- BLOQUE INFERIOR: TEXTO CENTRADO -->
  <g transform="translate(260, 0)">
    <text x="0" y="142" text-anchor="middle" class="brand-sub-vert-dark">APLICACIÓN DE INDEXACIÓN DE BIBLIOTECAS DIGITALES</text>
    <text x="0" y="168" text-anchor="middle" class="brand-tagline-vert-dark">Tu biblioteca digital, ordenada y al alcance.</text>
  </g>
</svg>
